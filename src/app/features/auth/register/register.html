<h1>Create Account</h1>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div>
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />

    <p *ngIf="form.controls.email.touched && form.controls.email.hasError('required')">
      Email is required.
    </p>

    <p *ngIf="form.controls.email.touched && form.controls.email.hasError('email')">
      Email format is invalid.
    </p>
  </div>

  <div>
    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="new-password" />

    <p *ngIf="form.controls.password.touched && form.controls.password.hasError('required')">
      Password is required.
    </p>

    <p *ngIf="form.controls.password.touched && form.controls.password.hasError('minlength')">
      Password must be at least 6 characters.
    </p>
  </div>

  <div>
    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" />

    <p *ngIf="form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('required')">
      Confirm password is required.
    </p>
  </div>

  <p class="success" *ngIf="successMessage">
    {{ successMessage }}
  </p>

  <p class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </p>

  <button type="submit" [disabled]="isLoading">
    {{ isLoading ? 'Creating account...' : 'Create account' }}
  </button>

  <p class="login-link">
    Already have an account?
    <a routerLink="/login">Log in</a>
  </p>
</form>
